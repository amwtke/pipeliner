# pipeliner Prometheus 告警规则。指标来自各 pod 的 /actuator/prometheus。
# 阈值按默认配置给出（水位 64、stalled-chunk-alert-millis 300000），请按实际情况调整。
groups:
  - name: pipeliner.data
    rules:
      - alert: PipelinerDeadLetters
        expr: increase(pipeliner_dead_letters_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "出现死信：graph={{ $labels.graph }} pipeline={{ $labels.pipeline }} 近 5 分钟新增 {{ $value | printf \"%.0f\" }} 条"
          description: "chunk 重试耗尽或投递次数超限后进入死信队列，对应 run 会失败。用 /pg/rounds/{id}/chunks?status=DEAD 查看，修复后 retry 或 skip。"

      - alert: PipelinerRoundFailed
        expr: increase(pipeliner_rounds_finished_total{status="FAILED"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "round 失败：graph={{ $labels.graph }} 近 5 分钟失败 {{ $value | printf \"%.0f\" }} 个"
          description: "查看 GET /pg/rounds/{id} 的 run/gate 状态与 error 字段；可 retry / rerun。"

      - alert: PipelinerGateWaitingTooLong
        expr: pipeliner_gate_waiting_seconds > 3600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "闸门等待过久：graph={{ $labels.graph }} round={{ $labels.round }} gate={{ $labels.gate }} 已等待 {{ $value | humanizeDuration }}"
          description: "人工闸门（manual）、external 闸门可能在等待操作或外部信号。默认阈值 1 小时；有意长时间等待的闸门可按 gate 标签排除。"

      - alert: PipelinerGateTimeout
        expr: increase(pipeliner_gate_timeouts_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "闸门超时：graph={{ $labels.graph }} gate={{ $labels.gate }} 策略={{ $labels.policy }}"
          description: "闸门超过 timeout；FAIL 策略会使下游 run 失败，OPEN_WITH_FALLBACK 会带 fallback 放行，ALERT_AND_WAIT 继续等待。"

      - alert: PipelinerStalledChunk
        expr: increase(pipeliner_stalled_chunk_alerts_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "chunk 停滞：graph={{ $labels.graph }} pipeline={{ $labels.pipeline }} 有待确认 chunk 空闲超过 stalled-chunk-alert-millis"
          description: "master 日志里有对应的 STALLED chunk WARN（含 round、entry、consumer、投递次数）。常见原因：worker 卡死或无存活 worker。"

      - alert: PipelinerOldestPendingHigh
        expr: pipeliner_oldest_pending_seconds > 300
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "最老待确认 chunk 空闲 {{ $value | humanizeDuration }}：round={{ $labels.round }} pipeline={{ $labels.pipeline }}"

      - alert: PipelinerBackpressureSustained
        # 通道长度在水位线上持续 10 分钟：下游处理不过来（autoscale 已到上限或下游卡住）。
        # 时间由 min_over_time 的 10 分钟窗口给出（窗口内每个样本都 >= 水位线），所以不再叠加 for:，否则要 ~20 分钟才触发。
        expr: min_over_time(pipeliner_channel_length[10m]) >= scalar(max(pipeliner_channel_high_watermark))
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "持续背压：graph={{ $labels.graph }} round={{ $labels.round }} 通道 {{ $labels.edge }} 10 分钟都在高水位（{{ $value }}）"
          description: "GET /pg/rounds/{id}/backpressure 查看瓶颈 pipeline；考虑提高 max-parallelism 或检查下游 sink。"

  - name: pipeliner.cluster
    rules:
      - alert: PipelinerNoLeader
        expr: (sum(pipeliner_leader) or vector(0)) < 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "pipeliner 没有 leader 已超过 1 分钟"
          description: "没有 master 调度 round。检查 Redis 连通性、pod 是否存活、master-enabled 是否被全部关闭。"

      - alert: PipelinerMultipleLeaders
        expr: sum(pipeliner_leader) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "同时有 {{ $value }} 个 pod 报告自己是 leader"
          description: "短暂重叠可能是抓取时间差；持续存在说明有 pod 没有感知到失去租约。fencing 保证数据正确，但需排查。"

      - alert: PipelinerLeaderFlapping
        # pipeliner_leader_changes_total 在每个进程启动时就以 0 注册，所以首次当选也计入 increase()；
        # 备用分支用 leader gauge 的翻转次数（每次换主 = 旧主 1→0 + 新主 0→1，共 2 次变化），不依赖 counter 的首个增量。
        expr: |
          sum(increase(pipeliner_leader_changes_total[10m])) > 3
          or sum(changes(pipeliner_leader[10m])) > 6
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "leader 频繁切换：近 10 分钟 {{ $value | printf \"%.0f\" }} 次"
          description: "检查 leader-ttl-millis 与 GC/网络抖动、Redis 延迟。"

      - alert: PipelinerRedisMemoryHigh
        # 2 GiB 仅为示例阈值，按 Redis maxmemory 调整；框架自身的限流见 pipeliner.runtime.redis-memory-limit-bytes
        expr: max(pipeliner_redis_used_memory_bytes) > 2 * 1024 * 1024 * 1024
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis 内存使用 {{ $value | humanize1024 }}B，超过阈值"
          description: "数据面 stream 与控制面（默认存 Redis）都占内存；确认数据保留（pipeliner.retention.*）在运行。"

      - alert: PipelinerRetentionNotRunning
        expr: |
          (time() - max(pipeliner_retention_last_run_timestamp_seconds)) > 3600
          or absent(pipeliner_retention_last_run_timestamp_seconds)
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "数据保留任务超过 1 小时没有运行"
          description: "由 leader 每 interval-minutes 分钟执行一次；确认 pipeliner.retention.enabled=true 且有 leader。若有意关闭保留，请屏蔽本规则。"

      - alert: PipelinerMasterNotTicking
        # 阈值 = max(60s, 2 × scrape_interval + 5 × 预期 tick 间隔)：样本最多比真实 tick 旧一个抓取间隔，再留一个抓取间隔的抓取延迟/失败余量。
        # 60 s 适用于 scrape_interval <= 15 s 且 tick 间隔（LOCAL tick-millis / EXTERNAL external-tick-interval-millis）<= 6 s；
        # 抓取间隔或触发间隔更大时按公式调大 60，并相应调整 for:。for: 1m 再吸收一次错过的 tick（leader 切换）。
        expr: |
          (time() - max(pipeliner_master_last_tick_timestamp_seconds) > 60
           or absent(pipeliner_master_last_tick_timestamp_seconds))
          and max(pipeliner_active_rounds) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "有活跃 round，但 master 已超过 60 秒没有完成 leader tick"
          description: "LOCAL 模式：检查是否有 leader / pg-master 线程；EXTERNAL 模式：检查调度器（xxl-job 等）是否在触发 POST /pg/master/tick 或 engine.tick()，以及 leader-ttl-millis >= 3 × external-tick-interval-millis。阈值公式见规则注释。"
